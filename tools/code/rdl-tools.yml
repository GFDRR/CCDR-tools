# This file may be used to create an environment using:
# conda env create --name rdl-tools --file rdl-tools.yml

name: rdl-tools
channels:
  - conda-forge
  - defaults
dependencies:
  # Core Python
  - python=3.10
  
  # Data manipulation and analysis
  - pandas
  # Pinned exactly (not left open-ended): this environment previously had an
  # unpinned `numpy` silently drift from whatever 1.x version rasterio/gdal/
  # fiona were built against up to 2.2.6, seven months later and unnoticed,
  # via some unrelated install. That drift was investigated as a suspect in a
  # native crash (a NumPy 1.x-built C extension reading/writing NumPy 2.x
  # array structures is undefined behavior) but was ultimately ruled out - the
  # real cause was an unrelated lxml/libxml2 bug (see CHANGES_1.0.md), and
  # 2.2.6 has otherwise run fine against this rasterio/gdal/fiona build. Kept
  # pinned to the exact version in active use specifically so a future
  # silent drift like this one can't happen again unnoticed; bump deliberately
  # (and re-verify rasterio/gdal/fiona compatibility) rather than dropping the
  # pin.
  - numpy=2.2.6
  
  # Geospatial libraries
  - geopandas
  - rasterio
  - rioxarray
  - rasterstats
  - shapely
  - fiona
  - gdal
  - cartopy
  
  # Scientific computing and parallel processing
  - xarray
  - netcdf4
  - dask
  - multiprocess
  
  # Visualization
  - matplotlib
  - seaborn
  - folium
  - branca
  
  # Web and networking
  - requests
  - urllib3
  
  # Jupyter and interactive widgets
  - jupyter
  - notebook
  - ipywidgets
  
  # File formats and I/O
  - openpyxl
  - python-dotenv

  # Testing
  - pytest
  
  # Progress bars and utilities
  - tqdm
  
  # Package manager
  - pip